Description: Gets the latest version of opencode from Github releases.
Identifier: com.github.jc0b.download.OpenCodeCLI
MinimumVersion: "2.3"

Input:
  ARCH: arm64
  NAME: OpenCodeCLI

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      github_repo: anomalyco/opencode
      asset_regex: "opencode-darwin-%ARCH%.zip"

  - Processor: URLDownloader
    Arguments:
      filename: "%NAME%-%ARCH%-%version%.zip"

  - Processor: EndOfCheckPhase

  - Processor: Unarchiver
    Arguments:
      archive_path: "%pathname%"
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%-%ARCH%"
      purge_destination: true

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%RECIPE_CACHE_DIR%/%NAME%-%ARCH%/opencode"
      requirement: identifier opencode and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = "5NZ4Q7NXJ4"
