Description: Gets the latest version of Pique, and imports it into Munki.
Identifier: com.github.jc0b.munki.Pique
ParentRecipe: com.github.jc0b.download.Pique
MinimumVersion: "2.7.6"

Input:
  NAME: Pique
  MUNKI_REPO_SUBDIR: "macadmins/pique"
  pkginfo:
    catalogs:
      - testing
    category: Utilities
    description: >
      A macOS Quick Look extension for syntax-highlighted previews of configuration files and scripts.
    developer: "Henry Stamerjohann"
    display_name: "%NAME%"
    minimum_os_version: "26.0"
    name: "%NAME%"
    unattended_install: true
    unattended_uninstall: true

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/unpack"
      flat_pkg_path: "%pathname%"
      purge_destination: true

  - Processor: FileFinder
    Arguments:
      pattern: "%RECIPE_CACHE_DIR%/unpack/*.pkg"

  - Processor: PkgPayloadUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/payload/Applications"
      pkg_payload_path: "%found_filename%/Payload"
      purge_destination: true

  - Processor: MunkiInstallsItemsCreator
    Arguments:
      faux_root: "%RECIPE_CACHE_DIR%/payload"
      installs_item_paths:
        - /Applications/Pique.app

  - Processor: MunkiPkginfoMerger

  - Processor: MunkiImporter
    Arguments:
      pkg_path: "%pathname%"
      repo_subdirectory: "%MUNKI_REPO_SUBDIR%"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/unpack"
        - "%RECIPE_CACHE_DIR%/payload"
