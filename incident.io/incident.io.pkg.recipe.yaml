Description: Gets the latest version of incident.io, and creates an installer pkg.
Identifier: com.github.jc0b.pkg.incident.io
MinimumVersion: "2.3"
ParentRecipe: com.github.jc0b.download.incident.io

Input:
  NAME: incident.io
  PKGID: com.incidentio.desktop

Process:
  - Processor: PkgRootCreator
    Arguments:
      pkgdirs:
        Applications: "0775"
      pkgroot: "%RECIPE_CACHE_DIR%/pkg_root"

  - Processor: Copier
    Arguments:
      source_path: "%RECIPE_CACHE_DIR%/%NAME%/%NAME%.app"
      destination_path: "%RECIPE_CACHE_DIR%/pkg_root/Applications/%NAME%.app"

  - Processor: PkgCreator
    Arguments:
      pkg_request:
        chown:
          - group: "admin"
            path: "/Applications/%NAME%.app"
            user: "root"
            mode: "0755"
        pkgname: "%NAME%-%version%"
        version: "%version%"
        id: "%PKGID%"
        pkgdir: "%RECIPE_CACHE_DIR%"
