Identifier: com.github.jc0b.munki.incident.io
Description: Imports an incident.io .pkg into Munki.
MinimumVersion: "2.3"
ParentRecipe: com.github.jc0b.pkg.incident.io

Input:
  MUNKI_REPO_SUBDIR: incident.io/incident.io
  NAME: incident.io
  pkginfo:
    catalogs:
      - testing
    description: The incident.io macOS desktop app brings incident response to your Mac, so you can get paged, investigate, and post updates back to the team without leaving your terminal.
    developer: Pineapple Technology Ltd.
    name: "%NAME%"
    unattended_install: true
    uninstall_method: removepackages

Process:
  - Processor: MunkiImporter
    Arguments:
      extract_icon: true
      pkg_path: "%pkg_path%"
      repo_subdirectory: "%MUNKI_REPO_SUBDIR%"
